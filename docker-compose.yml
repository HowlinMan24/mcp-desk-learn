# One PostgreSQL for both tracks. Each track has its own database, so a Prisma migration
# can never collide with a goose migration. Port 5544 avoids any Postgres already running on this laptop.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: desk
      POSTGRES_DB: desk
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tools/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desk"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
